services:
  - type: web
    name: ripple
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: ripple-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: ripple-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ripple-db
          property: password
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

databases:
  - name: ripple-db
    plan: free
    databaseName: ripple
    user: ripple_user
